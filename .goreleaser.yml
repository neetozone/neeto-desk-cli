version: 2

builds:
  - main: ./cmd/neetodesk/
    binary: neetodesk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

blobs:
  - provider: s3
    bucket: "neeto-downloads"
    directory: "cli/NeetoDesk/v{{ .Version }}"

brews:
  - name: neetodesk
    directory: Formula
    repository:
      owner: neetozone
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    url_template: "https://downloads.neeto.com/cli/NeetoDesk/v{{ .Version }}/{{ .ArtifactName }}"
    homepage: "https://neetodesk.com"
    description: "NeetoDesk CLI — manage tickets, customers and reports from the terminal"
    install: |
      bin.install "neetodesk"

release:
  name_template: "v{{ .Version }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
